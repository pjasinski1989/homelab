apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
data:
  bookmarks.yaml: ""
  custom.css: ""
  custom.js: ""
  docker.yaml: ""
  kubernetes.yaml: |
    mode: cluster
  services.yaml: |
    - Dashboards:
        - Grafana:
            icon: grafana.png
            href: https://grafana.zxnak37.ovh
            description: Dashboards & metrics
            namespace: monitoring
            app: grafana
        - Coroot:
            icon: https://coroot.zxnak37.ovh/static/favicon.ico
            href: https://coroot.zxnak37.ovh
            description: eBPF service map
            namespace: coroot
            app: coroot
        - Gatus:
            icon: gatus.png
            href: https://gatus.zxnak37.ovh
            description: Uptime checks
            namespace: gatus
            app: gatus
    - Metrics & alerts:
        - Prometheus:
            icon: prometheus.png
            href: https://prometheus.zxnak37.ovh
            description: Metrics database
            namespace: monitoring
            app: prometheus
        - Alertmanager:
            icon: alertmanager.png
            href: https://alertmanager.zxnak37.ovh
            description: Alert routing
            namespace: monitoring
            app: alertmanager
    - Network:
        - Traefik:
            icon: traefik.png
            href: https://traefik.zxnak37.ovh/dashboard/
            description: Ingress & certificates
            namespace: kube-system
            app: traefik
        - Speedtest Tracker:
            icon: speedtest-tracker.png
            href: https://speedtest.zxnak37.ovh
            description: Internet speed history
            namespace: speedtest
            app: speedtest-tracker
    - Storage:
        - Longhorn:
            icon: longhorn.png
            href: https://longhorn.zxnak37.ovh
            description: Replicated volumes
            namespace: longhorn-system
            app: longhorn-ui
            podSelector: app=longhorn-ui
  settings.yaml: |
    title: rpi homelab
    favicon: https://kubernetes.io/images/favicon.png
    headerStyle: clean
    layout:
      Dashboards:
        icon: mdi-view-dashboard
      Metrics & alerts:
        icon: mdi-database
      Network:
        icon: mdi-lan
      Storage:
        icon: mdi-harddisk
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "k3s"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - search:
        provider: duckduckgo
        target: _blank
