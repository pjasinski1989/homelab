apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: monitoring
spec:
  interval: 1h
  timeout: 15m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "82.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    # k3s runs these inside its own binary (and uses SQLite, not etcd): nothing to scrape, alerts fire falsely
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 500Mi
      ingress:
        enabled: true
        hosts:
          - alertmanager.zxnak37.ovh
        paths:
          - /
    grafana:
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki.logging.svc:3100
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: grafana-com
              folder: grafana.com
              type: file
              options:
                path: /var/lib/grafana/dashboards/grafana-com
      dashboards:
        grafana-com:
          node-exporter-full:
            gnetId: 1860
            revision: 46
          traefik:
            gnetId: 17347
            revision: 9
          k8s:
            gnetId: 15661
            revision: 2
            datasource:
              - name: DS__VICTORIAMETRICS-PROD-ALL
                value: prometheus
      ingress:
        enabled: true
        hosts:
          - grafana.zxnak37.ovh
      initChownData:
        enabled: false
      persistence:
        enabled: true
        size: 1Gi
        extraPvcLabels: # Longhorn backup (configs/longhorn-backup.yaml)
          recurring-job-source.longhorn.io: enabled
          recurring-job-group.longhorn.io/backup: enabled
      deploymentStrategy:
        type: Recreate # RWO volume
      securityContext:
        fsGroup: 472
        runAsGroup: 472
        runAsUser: 472
    prometheus:
      ingress:
        enabled: true
        hosts:
          - prometheus.zxnak37.ovh
        paths:
          - /
      prometheusSpec:
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 7d
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 1536Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi
