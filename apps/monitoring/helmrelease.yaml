apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: monitoring
spec:
  interval: 1h
  timeout: 15m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "82.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 500Mi
      ingress:
        enabled: true
        hosts:
          - alertmanager.zxnak37.ovh
        paths:
          - /
    grafana:
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: grafana-com
              folder: ""
              type: file
              options:
                path: /var/lib/grafana/dashboards/grafana-com
      dashboards:
        grafana-com:
          node-exporter-full:
            gnetId: 1860
            revision: 46
          traefik:
            gnetId: 17347
            revision: 9
          k8s:
            gnetId: 15661
            revision: 2
            datasource:
              - name: DS__VICTORIAMETRICS-PROD-ALL
                value: prometheus
          nats:
            gnetId: 16256
            revision: 2
            datasource:
              - name: DS_PROMETHEUS
                value: prometheus
          nats-jetstream:
            gnetId: 14862
            revision: 2
            datasource:
              - name: DS_PROMETHEUS
                value: prometheus
      ingress:
        enabled: true
        hosts:
          - grafana.zxnak37.ovh
      initChownData:
        enabled: false
      persistence:
        enabled: true
        storageClassName: longhorn
        size: 1Gi
      securityContext:
        fsGroup: 472
        runAsGroup: 472
        runAsUser: 472
    prometheus:
      ingress:
        enabled: true
        hosts:
          - prometheus.zxnak37.ovh
        paths:
          - /
      prometheusSpec:
        enableRemoteWriteReceiver: true # Coroot writes its eBPF metrics here
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        additionalScrapeConfigs:
          - job_name: blocky
            static_configs:
              - targets: ["blocky-http.blocky.svc:4000"]
          - job_name: nats
            static_configs:
              - targets: ["nats-0.nats-headless.nats.svc:7777"]
        retention: 7d
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 1Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi
