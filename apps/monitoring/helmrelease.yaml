apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: monitoring
spec:
  interval: 1h
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "82.4.3"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 500Mi
      ingress:
        enabled: true
        hosts:
          - alertmanager.zxnak37.ovh
        paths:
          - /
    grafana:
      ingress:
        enabled: true
        hosts:
          - grafana.zxnak37.ovh
      initChownData:
        enabled: false
      persistence:
        enabled: true
        size: 1Gi
      securityContext:
        fsGroup: 472
        runAsGroup: 472
        runAsUser: 472
    prometheus:
      ingress:
        enabled: true
        hosts:
          - prometheus.zxnak37.ovh
        paths:
          - /
      prometheusSpec:
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 7d
        resources:
          requests:
            memory: 256Mi
          limits:
            memory: 512Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi
