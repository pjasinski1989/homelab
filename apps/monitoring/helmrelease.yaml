apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: monitoring
spec:
  interval: 1h
  timeout: 15m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "82.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    # k3s runs these inside its own binary (and uses SQLite, not etcd): nothing to scrape, alerts fire falsely
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    # k3s: the server's kubelet endpoint also serves the embedded apiserver/etcd/scheduler metrics,
    # which the apiserver job already scrapes (~70k duplicate series)
    kubelet:
      serviceMonitor:
        metricRelabelings:
          - action: drop # chart default
            sourceLabels: [__name__, le]
            regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
          - action: drop
            sourceLabels: [__name__]
            regex: (apiserver|etcd|workqueue|scheduler)_.*
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
          - action: drop # chart default
            sourceLabels: [__name__, le]
            regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
          - action: drop # histograms no rule or dashboard uses (k3s has no etcd, kine/SQLite)
            sourceLabels: [__name__]
            regex: (etcd_request_duration_seconds|apiserver_watch_events_dispatch_duration_seconds|apiserver_watch_list_duration_seconds|apiserver_storage_list_duration_seconds|apiserver_request_body_size_bytes|apiserver_watch_cache_read_wait_seconds|apiserver_watch_cache_initialization_duration_seconds|apiserver_response_sizes|apiserver_watch_events_sizes)_bucket
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 500Mi
      ingress:
        enabled: true
        hosts:
          - alertmanager.zxnak37.ovh
        paths:
          - /
    grafana:
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki.logging.svc:3100
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: grafana-com
              folder: grafana.com
              type: file
              options:
                path: /var/lib/grafana/dashboards/grafana-com
      dashboards:
        grafana-com:
          node-exporter-full:
            gnetId: 1860
            revision: 46
          traefik:
            gnetId: 17347
            revision: 9
          k8s:
            gnetId: 15661
            revision: 2
            datasource:
              - name: DS__VICTORIAMETRICS-PROD-ALL
                value: prometheus
      ingress:
        enabled: true
        hosts:
          - grafana.zxnak37.ovh
      initChownData:
        enabled: false
      persistence:
        enabled: true
        size: 1Gi
        extraPvcLabels: # Longhorn backup (configs/longhorn-backup.yaml)
          recurring-job.longhorn.io/source: enabled
          recurring-job-group.longhorn.io/backup: enabled
      deploymentStrategy:
        type: Recreate # RWO volume
      securityContext:
        fsGroup: 472
        runAsGroup: 472
        runAsUser: 472
    prometheus:
      ingress:
        enabled: true
        hosts:
          - prometheus.zxnak37.ovh
        paths:
          - /
      prometheusSpec:
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 7d
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 1536Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi
