apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: speedtest-config
  namespace: speedtest
  labels:
    recurring-job.longhorn.io/source: enabled # Longhorn backup (configs/longhorn-backup.yaml)
    recurring-job-group.longhorn.io/backup: enabled
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
