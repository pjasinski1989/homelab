# Cluster agent with built-in kube-state-metrics: lets Coroot group containers into apps
# (Coroot only reads metrics pushed through it, so the monitoring kube-state-metrics doesn't count)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coroot-cluster-agent
  namespace: coroot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coroot-cluster-agent
rules:
  - apiGroups: [""]
    resources: [namespaces, nodes, pods, services, endpoints, persistentvolumeclaims, persistentvolumes, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, daemonsets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, volumeattachments]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [source.toolkit.fluxcd.io, kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io, notification.toolkit.fluxcd.io, fluxcd.controlplane.io]
    resources: ["*"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coroot-cluster-agent
subjects:
  - kind: ServiceAccount
    name: coroot-cluster-agent
    namespace: coroot
roleRef:
  kind: ClusterRole
  name: coroot-cluster-agent
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coroot-cluster-agent
  namespace: coroot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coroot-cluster-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coroot-cluster-agent
    spec:
      serviceAccountName: coroot-cluster-agent
      containers:
        - name: cluster-agent
          image: ghcr.io/coroot/coroot-cluster-agent:1.12.0
          args:
            - --listen=127.0.0.1:10301
            - --metrics-wal-dir=/tmp
          env:
            - name: COROOT_URL
              value: http://coroot.coroot:8080
            - name: METRICS_SCRAPE_INTERVAL
              value: 15s
            - name: KUBE_STATE_METRICS_ADDRESS
              value: 127.0.0.1:10302
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
