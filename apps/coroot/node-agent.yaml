# eBPF agent on every node, pushes metrics to Coroot (same settings as coroot-operator, minus logs/traces/profiles)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: coroot-node-agent
  namespace: coroot
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: coroot-node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coroot-node-agent
    spec:
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: node-agent
          image: ghcr.io/coroot/coroot-node-agent:1.38.3
          args:
            - --cgroupfs-root=/host/sys/fs/cgroup
          env:
            - name: SCRAPE_INTERVAL
              value: 15s
            - name: METRICS_ENDPOINT
              value: http://coroot.coroot:8080/v1/metrics
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              memory: 500Mi
          volumeMounts:
            - name: cgroupfs
              mountPath: /host/sys/fs/cgroup
              readOnly: true
            - name: tracefs
              mountPath: /sys/kernel/tracing
            - name: debugfs
              mountPath: /sys/kernel/debug
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cgroupfs
          hostPath:
            path: /sys/fs/cgroup
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
        - name: tmp
          emptyDir: {}
