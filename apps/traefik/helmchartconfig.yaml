apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  failurePolicy: reinstall
  valuesContent: |-
    certificatesResolvers:
      letsencrypt:
        acme:
          storage: /data/acme.json
          dnsChallenge:
            provider: ovh
    envFrom:
      - secretRef:
          name: ovh-credentials
    persistence:
      enabled: true
      storageClass: longhorn
    podSecurityContext:
      fsGroup: 65532 # Longhorn volumes are root-owned; lets Traefik write /data/acme.json
      fsGroupChangePolicy: OnRootMismatch
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        http:
          tls:
            enabled: true
            certResolver: letsencrypt
            domains:
              - main: zxnak37.ovh
                sans:
                  - "*.zxnak37.ovh"
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.zxnak37.ovh`)
        entryPoints:
          - websecure
    metrics:
      prometheus:
        service:
          enabled: true
        serviceMonitor:
          enabled: true
