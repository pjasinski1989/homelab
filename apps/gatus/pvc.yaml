apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gatus
  namespace: gatus
  labels:
    recurring-job-source.longhorn.io: enabled # Longhorn backup (configs/longhorn-backup.yaml)
    recurring-job-group.longhorn.io/backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
