apiVersion: v1
kind: Service
metadata:
  name: blocky
  namespace: blocky
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: blocky
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: blocky-http
  namespace: blocky
spec:
  selector:
    app.kubernetes.io/name: blocky
  ports:
    - name: http
      port: 4000
