- name: Prepare nodes
  hosts: all
  become: true
  tasks:
    - name: Passwordless sudo for the Ansible user
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ansible
        mode: '0440'
        content: "{{ lookup('config', 'DEFAULT_REMOTE_USER') }} ALL=(ALL) NOPASSWD:ALL\n"
        validate: visudo -cf %s

    - name: Enable cgroups
      ansible.builtin.lineinfile:
        path: /boot/firmware/cmdline.txt
        regexp: '^((?!.*{{ item }}).+)$'
        line: '\1 {{ item }}'
        backrefs: true
      loop:
        - cgroup_enable=cpuset
        - cgroup_enable=memory
        - cgroup_memory=1
      register: cgroups_result

    - name: Format NVMe drive if unpartitioned and unformatted
      community.general.filesystem:
        dev: /dev/nvme0n1
        fstype: ext4
        opts: -L data
      when:
        - "'nvme0n1' in ansible_facts['devices']"
        - ansible_facts['devices']['nvme0n1']['partitions'] == {}

    - name: Mount NVMe drive
      ansible.posix.mount:
        path: /mnt/data
        src: LABEL=data
        fstype: ext4
        opts: defaults,noatime,nofail
        state: mounted

    - name: Reboot
      ansible.builtin.reboot:
      when: cgroups_result.changed

- name: Configure k3s
  hosts: all
  become: true
  tasks:
    - name: Create k3s config folder
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'

    - name: Put k3s data, kubelet state, and volumes on NVMe
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: '0644'
        content: |
          data-dir: /mnt/data/k3s
          default-local-storage-path: /mnt/data/storage
          kubelet-arg:
            - "root-dir=/mnt/data/kubelet"

- name: Install K3s server
  hosts: servers
  become: true
  tasks:
    - name: Install K3s
      ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Fetch kubeconfig
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ./kubeconfig.yml
        flat: true

    - name: Point kubeconfig to server IP
      delegate_to: localhost
      become: false
      ansible.builtin.replace:
        path: ./kubeconfig.yml
        regexp: 'server: https://[^:]+:'
        replace: "server: https://{{ ansible_default_ipv4.address }}:"

