- name: Prepare nodes
  hosts: all
  become: true
  tasks:
    - name: Passwordless sudo for the Ansible user
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ansible
        mode: '0440'
        content: "{{ lookup('config', 'DEFAULT_REMOTE_USER') }} ALL=(ALL) NOPASSWD:ALL\n"
        validate: visudo -cf %s

    - name: Use router DNS so LAN hostnames resolve
      ansible.builtin.copy:
        dest: /etc/NetworkManager/conf.d/dns.conf
        mode: '0644'
        content: |
          [global-dns-domain-*]
          servers={{ ansible_default_ipv4.gateway }}
      register: dns_result

    - name: Reload NetworkManager
      ansible.builtin.systemd:
        name: NetworkManager
        state: reloaded
      when: dns_result.changed

    - name: Enable cgroups
      ansible.builtin.lineinfile:
        path: /boot/firmware/cmdline.txt
        regexp: '^((?!.*{{ item }}).+)$'
        line: '\1 {{ item }}'
        backrefs: true
      loop:
        - cgroup_enable=cpuset
        - cgroup_enable=memory
        - cgroup_memory=1
      register: cgroups_result

    - name: Format NVMe drive if unpartitioned and unformatted
      community.general.filesystem:
        dev: /dev/nvme0n1
        fstype: ext4
        opts: -L data
      when:
        - "'nvme0n1' in ansible_facts['devices']"
        - ansible_facts['devices']['nvme0n1']['partitions'] == {}

    - name: Mount NVMe drive
      ansible.posix.mount:
        path: /mnt/data
        src: LABEL=data
        fstype: ext4
        opts: defaults,noatime,nofail
        state: mounted

    - name: Fail if NVMe isn't mounted
      ansible.builtin.command: findmnt /mnt/data
      changed_when: false

    - name: Reboot
      ansible.builtin.reboot:
      when: cgroups_result.changed

- name: Configure k3s
  hosts: all
  become: true
  tasks:
    - name: Create k3s config folder
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'

    - name: Put k3s data, kubelet state, and volumes on NVMe
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: '0644'
        content: |
          data-dir: /mnt/data/k3s
          {% if 'servers' in group_names %}
          default-local-storage-path: /mnt/data/storage
          {% endif %}
          kubelet-arg:
            - "root-dir=/mnt/data/kubelet"

- name: Install K3s server
  hosts: servers
  become: true
  tasks:
    - name: Install K3s
      ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"

    - name: Read kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig

    - name: Save kubeconfig with server IP
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        dest: ~/.kube/rpi.yaml
        mode: '0600'
        content: "{{ kubeconfig.content | b64decode | replace('127.0.0.1', ansible_default_ipv4.address) | replace('default', 'k3s@rpi') }}"
      register: rpi_kubeconfig

    - name: Merge into ~/.kube/config and switch to rpi
      delegate_to: localhost
      become: false
      ansible.builtin.shell: >
        KUBECONFIG=~/.kube/rpi.yaml:~/.kube/config kubectl config view --flatten > ~/.kube/config.new
        && mv ~/.kube/config.new ~/.kube/config
      when: rpi_kubeconfig.changed

    - name: Read join token
      ansible.builtin.slurp:
        src: /mnt/data/k3s/server/node-token
      register: k3s_token

- name: Install K3s agents
  hosts: agents
  become: true
  vars:
    server: "{{ hostvars[groups['servers'][0]] }}"
  tasks:
    - name: Install K3s agent
      ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
        K3S_URL: "https://{{ server.ansible_hostname }}:6443"
        K3S_TOKEN: "{{ server.k3s_token.content | b64decode | trim }}"

- name: Install Flux
  hosts: servers
  become: true
  tasks:
    - name: Install Flux Operator
      ansible.builtin.get_url:
        url: https://github.com/controlplaneio-fluxcd/flux-operator/releases/latest/download/install.yaml
        dest: /mnt/data/k3s/server/manifests/flux-operator.yaml
        mode: '0600'

    - name: Wait for FluxInstance CRD
      ansible.builtin.command: k3s kubectl wait --for condition=established crd/fluxinstances.fluxcd.controlplane.io
      register: crd
      until: crd.rc == 0
      retries: 30
      delay: 5
      changed_when: false

    - name: Create FluxInstance
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../flux/flux-instance.yaml"
        dest: /mnt/data/k3s/server/manifests/flux-instance.yaml
        mode: '0600'

    - name: Create SOPS age secret
      ansible.builtin.copy:
        dest: /mnt/data/k3s/server/manifests/sops-age.yaml
        mode: '0600'
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: sops-age
            namespace: flux-system
          stringData:
            age.agekey: |
              {{ lookup('file', '~/.config/sops/age/keys.txt') | indent(4) }}
      no_log: true
