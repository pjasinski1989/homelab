<svg xmlns="http://www.w3.org/2000/svg" viewBox="280 0 540 498" width="540" height="498" role="img" aria-label="Flux Operator in the k3s cluster pulls the GitHub repo every minute, decrypts SOPS secrets and applies the apps: Traefik, Blocky, Longhorn and monitoring. rpi1 is the server, rpi2 an agent, rpi3 a planned agent. OS on SD card, k3s data and Longhorn volumes on NVMe.">
  <title>Homelab architecture</title>
  <style>
    svg { --bg: #f5f7f9; --surface: #ffffff; --fg: #18202a; --muted: #5b6673; --line: #b9c2cc; --accent: #1f6fd1; --accent-soft: #e6effb; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #0f1318; --surface: #171d24; --fg: #e4e9ef; --muted: #96a1ad; --line: #3a4552; --accent: #6ea8ff; --accent-soft: #19283b; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Inter, sans-serif; fill: var(--fg); font-size: 12px; }
    .t { font-weight: 600; font-size: 14px; }
    .s { fill: var(--muted); font-size: 11.5px; }
    .m { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 11.5px; }
    .zone { font-size: 11px; letter-spacing: .08em; fill: var(--muted); font-weight: 600; }
    .bg { fill: var(--bg); }
    .cluster { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
    .hot { stroke: var(--accent); fill: var(--accent-soft); }
    .planned { stroke-dasharray: 5 4; }
    .pill { fill: var(--bg); stroke: var(--line); }
    .wire { fill: none; stroke: var(--accent); stroke-width: 2; }
    .lbl { fill: var(--accent); font-size: 11.5px; font-weight: 500; }
    .head { fill: var(--accent); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="bg" x="280" y="0" width="540" height="498"/>

  <rect class="box hot" x="400" y="12" width="300" height="84" rx="8"/>
  <text class="t" x="416" y="38">GitHub · homelab @ main</text>
  <text class="m" x="416" y="62">flux/ → apps/</text>
  <text class="s" x="416" y="82">secrets SOPS-encrypted</text>

  <rect class="cluster" x="300" y="126" width="500" height="360" rx="10"/>
  <text class="zone" x="316" y="146">K3S CLUSTER</text>

  <rect class="box hot" x="450" y="154" width="200" height="60" rx="8"/>
  <text class="t" x="466" y="178">Flux Operator</text>
  <text class="s" x="466" y="198">source · kustomize · helm</text>

  <rect class="box" x="324" y="238" width="452" height="128" rx="8"/>
  <text class="m" x="340" y="259">apps/</text>
  <rect class="pill" x="340" y="270" width="200" height="38" rx="6"/>
  <text x="352" y="294"><tspan font-weight="600">Traefik</tspan><tspan class="s"> · ingress, wildcard TLS</tspan></text>
  <rect class="pill" x="556" y="270" width="200" height="38" rx="6"/>
  <text x="568" y="294"><tspan font-weight="600">Blocky</tspan><tspan class="s"> · LAN DNS, ad block</tspan></text>
  <rect class="pill" x="340" y="318" width="200" height="38" rx="6"/>
  <text x="352" y="342"><tspan font-weight="600">Longhorn</tspan><tspan class="s"> · volumes, 2 copies</tspan></text>
  <rect class="pill" x="556" y="318" width="200" height="38" rx="6"/>
  <text x="568" y="342"><tspan font-weight="600">monitoring</tspan><tspan class="s"> · Prom, Grafana</tspan></text>

  <rect class="box" x="324" y="382" width="140" height="68" rx="8"/>
  <text class="t" x="338" y="406">rpi1 · server</text>
  <text class="s" x="338" y="425">k3s · SQLite</text>
  <text class="s" x="338" y="441">API :6443</text>

  <rect class="box" x="480" y="382" width="140" height="68" rx="8"/>
  <text class="t" x="494" y="406">rpi2 · agent</text>
  <text class="s" x="494" y="425">joins rpi1:6443</text>

  <rect class="box planned" x="636" y="382" width="140" height="68" rx="8"/>
  <text class="t" x="650" y="406">rpi3 · agent</text>
  <text class="s" x="650" y="425">joins rpi1:6443</text>
  <text class="s" x="650" y="441">planned</text>

  <text class="s" x="324" y="472">Every node: OS on SD card · NVMe holds k3s data and Longhorn volumes</text>

  <path class="wire" d="M550 96 V150" marker-end="url(#a)"/>
  <text class="lbl" x="562" y="116">pulls every 1m · HTTPS</text>

  <path class="wire" d="M550 214 V234" marker-end="url(#a)"/>
  <text class="lbl" x="562" y="230">applies · decrypts SOPS</text>
</svg>
