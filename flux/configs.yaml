# Resources that need CRDs from charts in apps/ (e.g. Longhorn RecurringJob)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-apps
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./configs
  prune: true
