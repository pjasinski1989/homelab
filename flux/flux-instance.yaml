apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.x"
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
  sync:
    kind: GitRepository
    url: https://github.com/pjasinski1989/homelab.git
    ref: refs/heads/main
    path: flux
